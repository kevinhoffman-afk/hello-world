<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dunk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { cursor: none; }
    canvas { display: block; touch-action: none; image-rendering: pixelated; }
    #s { position: absolute; top: 0; left: 0; pointer-events: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="s"></canvas>
<script>
const c = document.getElementById('c');
const mainCtx = c.getContext('2d');
const sp = document.getElementById('s');        // finer-pixel layer for the player
const spriteCtx = sp.getContext('2d');
let ctx = mainCtx;
const bg = document.createElement('canvas');   // static arena, painted once per resize
const bctx = bg.getContext('2d');
const FONT = '"Press Start 2P", monospace';
const OUT = '#1a0a05';                          // sprite outline

// Everything is drawn in screen pixels onto a canvas 1/P the size, then scaled up
// with no smoothing: that's what gives the chunky arcade-sprite look.
let W, H, P, PS, PX, u, R, floorY, rimY, bbX, rimF, rimB, poleX;

function layout() {
  W = innerWidth; H = innerHeight;
  floorY = H * 0.86;
  u = Math.min(floorY / 13.5, W / 20);   // 1 u ≈ 1 foot
  P = Math.max(2, Math.round(u / 15));   // chunkier pixels on bigger screens
  c.width = bg.width = Math.ceil(W / P);
  c.height = bg.height = Math.ceil(H / P);
  c.style.width = W + 'px'; c.style.height = H + 'px';
  ctx.setTransform(1 / P, 0, 0, 1 / P, 0, 0);
  bctx.setTransform(1 / P, 0, 0, 1 / P, 0, 0);
  ctx.imageSmoothingEnabled = false;
  PS = Math.max(1, Math.round(P / 2));
  sp.width = Math.ceil(W / PS); sp.height = Math.ceil(H / PS);
  sp.style.width = W + 'px'; sp.style.height = H + 'px';
  spriteCtx.setTransform(1 / PS, 0, 0, 1 / PS, 0, 0);
  PX = P;
  R = 0.42 * u;                           // ball radius
  rimY = floorY - 10 * u;                 // 10 ft rim
  bbX = W - Math.max(3.4 * u, W * 0.1);   // backboard front face
  rimB = bbX - 0.5 * u;                   // back of rim
  rimF = rimB - 1.5 * u;                  // front of rim
  poleX = bbX + 2.6 * u;
  paintBackground();
}

function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function paintBackground() {
  const g = bctx, rand = rng(23);
  let grad = g.createLinearGradient(0, 0, 0, floorY);
  grad.addColorStop(0, '#140a1f'); grad.addColorStop(1, '#3b1d2c');
  g.fillStyle = grad; g.fillRect(0, 0, W, floorY);

  // packed crowd, dimmer toward the upper deck
  const skins = ['#ffdbac', '#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#5c3a1e'];
  const shirts = ['#d62828', '#f77f00', '#fcbf49', '#2a9d8f', '#264653', '#e9c46a', '#8338ec',
                  '#3a86ff', '#ff006e', '#f1f1f1', '#1b998b', '#c1121f', '#6a4c93'];
  const hair = ['#1a0f08', '#2b1a10', '#5a3b1c', '#c9a15a', '#777'];
  const bottom = floorY - 1.2 * u, rowH = 0.6 * u, colW = 0.5 * u;
  for (let y = -0.2 * u; y < bottom; y += rowH) {
    const near = Math.max(0, y / bottom);
    for (let x = -colW * rand(); x < W + colW; x += colW * (0.8 + rand() * 0.4)) {
      const hx = x + rand() * 0.12 * u, hy = y + rand() * 0.14 * u;
      g.globalAlpha = 0.3 + 0.7 * near;
      g.fillStyle = shirts[(rand() * shirts.length) | 0];
      g.fillRect(hx - 0.22 * u, hy + 0.15 * u, 0.44 * u, rowH);
      if (rand() < 0.07) {                                  // someone with their arms up
        g.fillRect(hx - 0.3 * u, hy - 0.45 * u, 0.1 * u, 0.6 * u);
        g.fillRect(hx + 0.2 * u, hy - 0.45 * u, 0.1 * u, 0.6 * u);
      }
      g.fillStyle = skins[(rand() * skins.length) | 0];
      g.beginPath(); g.arc(hx, hy, 0.17 * u, 0, Math.PI * 2); g.fill();
      if (rand() < 0.6) {
        g.fillStyle = hair[(rand() * hair.length) | 0];
        g.fillRect(hx - 0.17 * u, hy - 0.19 * u, 0.34 * u, 0.12 * u);
      }
    }
  }
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(18,8,30,0.4)';                        // push the crowd back so the player pops
  g.fillRect(0, 0, W, bottom);
  grad = g.createLinearGradient(0, 0, 0, floorY * 0.5);
  grad.addColorStop(0, 'rgba(0,0,0,0.65)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, W, floorY * 0.5);

  // courtside boards
  const boardTop = floorY - 1.2 * u;
  for (let x = 0, i = 0; x < W; x += 4 * u, i++) {
    g.fillStyle = i % 2 ? '#1d2f7a' : '#b3122a';
    g.fillRect(x, boardTop, 4 * u, 1.2 * u);
    g.fillStyle = 'rgba(255,255,255,0.18)';
    g.fillRect(x + 0.4 * u, boardTop + 0.35 * u, 3.2 * u, 0.5 * u);
  }
  g.fillStyle = '#fff'; g.fillRect(0, boardTop, W, 0.08 * u);

  // glossy hardwood
  grad = g.createLinearGradient(0, floorY, 0, H);
  grad.addColorStop(0, '#f0a456'); grad.addColorStop(1, '#b8662b');
  g.fillStyle = grad; g.fillRect(0, floorY, W, H - floorY);
  g.fillStyle = 'rgba(120,55,15,0.28)';
  for (let y = floorY + 0.3 * u; y < H; y += 0.3 * u) g.fillRect(0, y, W, P);
  grad = g.createLinearGradient(0, floorY, 0, floorY + 1.2 * u);
  grad.addColorStop(0, 'rgba(255,240,210,0.35)'); grad.addColorStop(1, 'rgba(255,240,210,0)');
  g.fillStyle = grad; g.fillRect(0, floorY, W, 1.2 * u);
  // red apron past the baseline
  g.fillStyle = '#b3122a'; g.fillRect(bbX + 0.1 * u, floorY, W, H - floorY);
  g.fillStyle = '#fff';
  g.fillRect(0, floorY, W, P);
  g.fillRect(bbX + 0.1 * u, floorY, 0.15 * u, H - floorY);
}

// ---------- state + input ----------
let mx, my;
let history = [];
let hasBall = true, cooldown = 0;
let balls = [], popups = [], sparks = [], flashes = [];
let makes = 0, shots = 0, streak = 0, netSway = 0, clock = 0;

layout();
mx = W * 0.35; my = H * 0.4;
addEventListener('resize', layout);
document.fonts && document.fonts.load(`8px ${FONT}`);

function clampHand() {
  my = Math.min(my, floorY - 6.3 * u);
  my = Math.max(my, R);
  mx = Math.max(3 * u, Math.min(W - R, mx));
}
function track(e) {
  mx = e.clientX; my = e.clientY; clampHand();
  const now = performance.now();
  history.push({ x: mx, y: my, t: now });
  while (history.length && now - history[0].t > 90) history.shift();
}
function drop() {
  if (!hasBall) return;
  let vx = 0, vy = 0;
  const now = performance.now();
  while (history.length && now - history[0].t > 90) history.shift();
  if (history.length > 1) {
    const a = history[0], b = history[history.length - 1];
    const dt = Math.max((b.t - a.t) / 1000, 0.016);
    vx = (b.x - a.x) / dt; vy = (b.y - a.y) / dt;
    const max = 40 * u, sp = Math.hypot(vx, vy);
    if (sp > max) { vx *= max / sp; vy *= max / sp; }
  }
  balls.push({ x: mx, y: my, vx, vy, rot: 0, life: 0, fire: streak >= 3 });
  if (balls.length > 12) balls.shift();
  shots++;
  hasBall = false; cooldown = 0.4;
}
c.addEventListener('pointermove', track);
c.addEventListener('pointerdown', e => {
  track(e);
  if (e.pointerType === 'mouse') drop();
});
c.addEventListener('pointerup', e => {
  if (e.pointerType !== 'mouse') drop();
});

// ---------- physics ----------
function bounceOffPoint(b, px, py, rad, e) {
  const dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy), min = R + rad;
  if (d >= min || d === 0) return false;
  const nx = dx / d, ny = dy / d;
  b.x = px + nx * min; b.y = py + ny * min;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; }
  return true;
}
function bounceOffRect(b, x0, y0, x1, y1, e) {
  const cx = Math.max(x0, Math.min(b.x, x1)), cy = Math.max(y0, Math.min(b.y, y1));
  if (cx === b.x && cy === b.y) { b.x = x0 - R; b.vx = -Math.abs(b.vx) * e; return true; }
  return bounceOffPoint(b, cx, cy, 0, e);
}
function step(b, dt) {
  const prevY = b.y;
  b.vy += 32 * u * dt;
  b.x += b.vx * dt; b.y += b.vy * dt;
  b.rot += b.vx * dt / R;

  if (bounceOffPoint(b, rimF, rimY, 0.09 * u, 0.55)) b.touched = true;
  if (bounceOffPoint(b, rimB, rimY, 0.09 * u, 0.55)) b.touched = true;
  if (bounceOffRect(b, bbX, rimY - 2.9 * u, bbX + 0.3 * u, rimY + 0.6 * u, 0.65)) b.touched = true;
  bounceOffRect(b, poleX - 0.25 * u, rimY - 0.9 * u, poleX + 0.25 * u, floorY, 0.5);

  if (b.y > floorY - R) {
    b.y = floorY - R;
    if (b.vy > 0) b.vy = -b.vy * 0.62;
    b.vx *= 0.9;
    if (Math.abs(b.vy) < 2 * u) b.vy = 0;
    if (!b.scored && !b.missed) { b.missed = true; streak = 0; }
  }
  if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx) * 0.6; }

  if (!b.scored && !b.missed && prevY < rimY && b.y >= rimY && b.vy > 0 && b.x > rimF && b.x < rimB) {
    b.scored = true; makes++; streak++; netSway = 1;
    const text = streak === 3 ? 'ON FIRE!' : b.touched ? 'JAM!' : 'SWISH!';
    popups.push({ x: (rimF + rimB) / 2, y: rimY - 2.2 * u, t: 0, text });
  }
}

// ---------- drawing helpers ----------
function tube(x1, y1, x2, y2, w) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#16324f'; ctx.lineWidth = w + 2 * P;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = '#7ec8e3'; ctx.lineWidth = w;
  ctx.stroke();
  ctx.strokeStyle = '#dff6ff'; ctx.lineWidth = w * 0.3;
  ctx.beginPath(); ctx.moveTo(x1 - w * 0.2, y1 - w * 0.2); ctx.lineTo(x2 - w * 0.2, y2 - w * 0.2); ctx.stroke();
}

function star(x, y, s, alpha) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#9fd8ff';
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.18, y - s * 0.18); ctx.lineTo(x + s, y);
  ctx.lineTo(x + s * 0.18, y + s * 0.18); ctx.lineTo(x, y + s); ctx.lineTo(x - s * 0.18, y + s * 0.18);
  ctx.lineTo(x - s, y); ctx.lineTo(x - s * 0.18, y - s * 0.18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x, y, s * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}

function arcadeText(text, x, y, size, fill, align = 'left') {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = '#000'; ctx.fillText(text, x + P, y + P);
  ctx.lineJoin = 'round'; ctx.lineWidth = P * 1.5; ctx.strokeStyle = '#000'; ctx.strokeText(text, x, y);
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
}

function drawHoop() {
  // padded base + light-blue stanchion
  ctx.fillStyle = '#b3122a'; ctx.fillRect(poleX - 0.9 * u, floorY - 1.6 * u, 2.6 * u, 1.6 * u);
  ctx.fillStyle = '#e63946'; ctx.fillRect(poleX - 0.9 * u, floorY - 1.6 * u, 2.6 * u, 0.25 * u);
  ctx.fillStyle = OUT; ctx.fillRect(poleX - 0.9 * u, floorY - 1.6 * u, P, 1.6 * u);
  tube(poleX, floorY - 1.6 * u, poleX, rimY - 0.9 * u, 0.5 * u);
  tube(poleX, rimY - 0.9 * u, bbX + 0.4 * u, rimY - 2.3 * u, 0.36 * u);
  tube(poleX, rimY - 0.2 * u, bbX + 0.4 * u, rimY + 0.3 * u, 0.3 * u);
  // glass backboard, edge-on, with padded bottom
  ctx.fillStyle = 'rgba(190,235,255,0.6)'; ctx.fillRect(bbX, rimY - 2.9 * u, 0.3 * u, 3.5 * u);
  ctx.fillStyle = '#fff'; ctx.fillRect(bbX, rimY - 2.9 * u, P, 3.5 * u);
  ctx.fillStyle = '#1d3557'; ctx.fillRect(bbX - P, rimY + 0.45 * u, 0.3 * u + 2 * P, 0.3 * u);
}

function drawRimAndNet() {
  const sway = Math.sin(netSway * 12) * netSway * 0.35 * u;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = P;
  const nb = rimY + 1.6 * u, inset = 0.35 * u;
  for (let i = 0; i <= 5; i++) {
    const tx = rimF + (rimB - rimF) * i / 5;
    const bx = rimF + inset + (rimB - rimF - 2 * inset) * (5 - i) / 5 + sway;
    ctx.beginPath(); ctx.moveTo(tx, rimY); ctx.lineTo(bx, nb); ctx.stroke();
  }
  for (let k = 1; k <= 3; k++) {
    const y = rimY + (nb - rimY) * k / 3, ins = inset * k / 3, s = sway * k / 3;
    ctx.beginPath(); ctx.moveTo(rimF + ins + s, y); ctx.lineTo(rimB - ins + s, y); ctx.stroke();
  }
  ctx.lineCap = 'round';
  ctx.strokeStyle = OUT; ctx.lineWidth = 0.2 * u + 2 * P;
  ctx.beginPath(); ctx.moveTo(rimF, rimY); ctx.lineTo(bbX, rimY); ctx.stroke();
  ctx.strokeStyle = '#ff4d1a'; ctx.lineWidth = 0.2 * u;
  ctx.stroke();
}

function drawShadow(x, height) {
  const k = Math.max(0.25, 1 - height / (12 * u));
  ctx.fillStyle = `rgba(40,15,0,${0.35 * k})`;
  ctx.beginPath(); ctx.ellipse(x, floorY + 0.25 * u, 1.4 * u * k, 0.18 * u, 0, 0, Math.PI * 2); ctx.fill();
}

function drawBall(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = OUT;
  ctx.beginPath(); ctx.arc(0, 0, R + PX, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f07a1f';
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = PX;
  ctx.beginPath(); ctx.moveTo(-R, 0); ctx.lineTo(R, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -R); ctx.lineTo(0, R); ctx.stroke();
  ctx.beginPath(); ctx.arc(-R * 1.25, 0, R * 0.85, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(R * 1.25, 0, R * 0.85, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,230,180,0.7)';
  ctx.beginPath(); ctx.arc(x - R * 0.4, y - R * 0.4, R * 0.25, 0, Math.PI * 2); ctx.fill();
}

// ---------- player sprite ----------
// The player is drawn on his own layer with finer pixels than the arena, so the
// face, hands and shoes can carry detail. Units are u (≈ 1 ft), origin = the ball.
const SKIN = { base: '#6b3f24', dark: '#4a2915', hi: '#a06a42' };
const SKIN_FAR = { base: '#54301a', dark: '#3a1f0e', hi: '#7c4f2f' };
const WHITE = { base: '#f2f2f2', dark: '#b9b9c2', hi: '#ffffff' };
const BRACE = { base: '#222', dark: '#0c0c0c', hi: '#555' };

function capsule(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1e-6;
  const nx = -dy / d, ny = dx / d;
  ctx.beginPath();
  ctx.moveTo(a[0] + nx * a[2], a[1] + ny * a[2]); ctx.lineTo(b[0] + nx * b[2], b[1] + ny * b[2]);
  ctx.lineTo(b[0] - nx * b[2], b[1] - ny * b[2]); ctx.lineTo(a[0] - nx * a[2], a[1] - ny * a[2]);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(a[0], a[1], a[2], 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(b[0], b[1], b[2], 0, Math.PI * 2); ctx.fill();
}
// A tapered limb through joints [x, y, radius]: outline, shadow tone, body tone, sheen.
function limb(pts, tone, grow = 0.045) {
  const pass = (color, g, ox, oy, k) => {
    ctx.fillStyle = color;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      capsule([a[0] + ox, a[1] + oy, a[2] * k + g], [b[0] + ox, b[1] + oy, b[2] * k + g]);
    }
  };
  pass(OUT, grow, 0, 0, 1);
  pass(tone.dark, 0, 0, 0, 1);
  pass(tone.base, 0, -0.022, -0.026, 0.78);
  pass(tone.hi, 0, -0.05, -0.06, 0.26);
}
function poly(pts, fill, stroke = OUT, lw = 0.06) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function line(pts, color, w) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}

// Black-and-red leather high-top (no logos). Toe along +x, sole on y = 0; the
// ankle sits at (0.22, -0.5) in shoe space.
function shoe(ax, ay, ang) {
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang); ctx.translate(-0.22, 0.5);
  const upper = [[0.02, -0.15], [-0.03, -0.44], [0.03, -0.66], [0.33, -0.69], [0.41, -0.73],
                 [0.47, -0.6], [0.64, -0.4], [0.86, -0.29], [1.0, -0.23], [1.05, -0.15]];
  poly([...upper, [1.06, -0.03], [1.0, 0.01], [0.02, 0.01], [-0.03, -0.08]], OUT, OUT, 0.1);
  poly(upper, '#171717', null);
  const red = '#d0102b';
  poly([[0.02, -0.15], [-0.03, -0.44], [0.2, -0.41], [0.33, -0.15]], red, null);          // heel counter
  poly([[-0.01, -0.5], [0.03, -0.64], [0.33, -0.67], [0.39, -0.5], [0.16, -0.44]], red, null); // ankle collar
  poly([[0.73, -0.15], [0.75, -0.31], [0.86, -0.29], [1.0, -0.23], [1.05, -0.15]], red, null); // toe cap
  line([[0.03, -0.67], [0.33, -0.7]], '#050505', 0.05);                                   // collar lining
  line([[0.08, -0.32], [0.45, -0.34], [0.74, -0.2]], 'rgba(255,255,255,0.2)', 0.025);       // stitching
  line([[0.06, -0.6], [0.3, -0.63]], 'rgba(255,255,255,0.35)', 0.03);                       // leather sheen
  line([[0.78, -0.28], [0.97, -0.22]], 'rgba(255,255,255,0.35)', 0.03);
  for (let i = 0; i < 4; i++) {                                                             // red laces
    const t = i / 4, x = 0.43 + t * 0.19, y = -0.67 + t * 0.26;
    line([[x - 0.06, y - 0.02], [x + 0.06, y + 0.04]], '#ef2340', 0.05);
  }
  poly([[0.02, -0.15], [1.05, -0.15], [1.06, -0.07], [0.0, -0.07]], '#f4f4f4', null);       // midsole
  poly([[0.0, -0.07], [1.06, -0.07], [1.0, 0.0], [0.02, 0.0]], '#c20f27', null);            // outsole
  ctx.restore();
}

function drawHead() {
  ctx.save(); ctx.translate(-1.5, 1.3); ctx.rotate(-0.35);   // tipped back, eyes on the rim
  ctx.beginPath();
  ctx.moveTo(-0.12, 0.4);
  ctx.quadraticCurveTo(-0.39, 0.26, -0.35, -0.05);   // back of head
  ctx.quadraticCurveTo(-0.3, -0.43, 0.02, -0.43);    // crown
  ctx.quadraticCurveTo(0.3, -0.41, 0.34, -0.14);     // forehead
  ctx.lineTo(0.375, -0.07);                          // brow ridge
  ctx.lineTo(0.35, -0.02);                           // eye socket
  ctx.quadraticCurveTo(0.44, 0.05, 0.47, 0.115);     // nose
  ctx.lineTo(0.395, 0.145);                          // under the nose
  ctx.lineTo(0.415, 0.2);                            // upper lip
  ctx.lineTo(0.36, 0.235);                           // open mouth
  ctx.lineTo(0.395, 0.29);                           // lower lip
  ctx.quadraticCurveTo(0.385, 0.37, 0.3, 0.405);     // chin
  ctx.quadraticCurveTo(0.1, 0.47, -0.12, 0.4);       // jaw
  ctx.closePath();
  ctx.strokeStyle = OUT; ctx.lineWidth = 0.09; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.fillStyle = SKIN.base; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = SKIN.dark;                          // shade the back and underside
  ctx.beginPath(); ctx.ellipse(-0.3, 0.2, 0.3, 0.4, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0.12, 0.5, 0.35, 0.12, -0.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = SKIN.hi;                            // shine on the shaved head
  ctx.beginPath(); ctx.ellipse(0.02, -0.31, 0.17, 0.065, 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c8905f';
  ctx.beginPath(); ctx.ellipse(0.05, -0.33, 0.06, 0.025, 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = SKIN.hi;                            // cheekbone + nose bridge
  ctx.beginPath(); ctx.ellipse(0.25, 0.09, 0.07, 0.04, -0.4, 0, Math.PI * 2); ctx.fill();
  line([[0.37, -0.01], [0.43, 0.08]], SKIN.hi, 0.025);
  ctx.restore();
  // ear
  ctx.fillStyle = OUT; ctx.beginPath(); ctx.ellipse(-0.1, 0.05, 0.1, 0.14, 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = SKIN.base; ctx.beginPath(); ctx.ellipse(-0.1, 0.05, 0.07, 0.11, 0.15, 0, Math.PI * 2); ctx.fill();
  line([[-0.08, -0.02], [-0.12, 0.05], [-0.09, 0.1]], SKIN.dark, 0.025);
  // brow + eye looking up at the ball
  line([[0.19, -0.105], [0.335, -0.09]], '#140a05', 0.04);
  ctx.fillStyle = '#efe6dc';
  ctx.beginPath(); ctx.ellipse(0.27, -0.025, 0.055, 0.028, -0.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a0d06';
  ctx.beginPath(); ctx.arc(0.295, -0.035, 0.022, 0, Math.PI * 2); ctx.fill();
  line([[0.21, -0.05], [0.325, -0.052]], '#140a05', 0.02);
  // nostril, mustache, open mouth with the tongue out
  ctx.fillStyle = '#2a140a';
  ctx.beginPath(); ctx.ellipse(0.39, 0.115, 0.03, 0.018, 0.4, 0, Math.PI * 2); ctx.fill();
  line([[0.33, 0.165], [0.405, 0.17]], '#150a05', 0.03);
  poly([[0.36, 0.215], [0.415, 0.21], [0.395, 0.275], [0.355, 0.245]], '#3a0d0d', null);
  ctx.fillStyle = '#d66f7a';
  ctx.beginPath(); ctx.ellipse(0.425, 0.25, 0.05, 0.028, 0.35, 0, Math.PI * 2); ctx.fill();
  line([[0.4, 0.245], [0.455, 0.26]], '#b0515c', 0.012);
  line([[0.2, 0.3], [0.3, 0.37]], SKIN.dark, 0.02);                 // jaw line
  ctx.restore();
}

function drawJersey() {
  const red = '#d91a2c', redDark = '#a50d22', redHi = '#f2465a';
  // baggy shorts
  const shorts = [[-2.45, 3.55], [-1.3, 3.6], [-1.05, 4.7], [-1.95, 4.83], [-2.1, 4.46], [-2.82, 4.68]];
  poly(shorts, red, OUT, 0.09);
  poly([[-2.45, 3.58], [-2.12, 3.6], [-2.12, 4.46], [-2.8, 4.66]], redDark, null);
  line([[-1.34, 3.66], [-1.1, 4.66]], '#111', 0.11);                 // side stripe
  line([[-1.34, 3.66], [-1.1, 4.66]], '#fff', 0.04);
  line([[-1.08, 4.64], [-1.93, 4.77]], '#fff', 0.035);               // hem trim
  line([[-1.75, 3.8], [-1.6, 4.4]], redDark, 0.03);                  // folds
  line([[-2.3, 3.9], [-2.45, 4.4]], '#8a0a1c', 0.03);
  poly([[-2.47, 3.5], [-1.29, 3.55], [-1.29, 3.68], [-2.47, 3.63]], '#111', null);
  // tank top
  poly([[-1.3, 1.92], [-1.5, 2.08], [-1.8, 2.1], [-2.15, 1.96], [-2.5, 3.6], [-1.3, 3.64], [-1.22, 2.8]], red, OUT, 0.09);
  poly([[-2.15, 1.98], [-1.98, 2.1], [-2.12, 3.6], [-2.48, 3.58]], redDark, null);
  ctx.fillStyle = redHi;
  ctx.beginPath(); ctx.ellipse(-1.48, 2.45, 0.1, 0.28, -0.1, 0, Math.PI * 2); ctx.fill();
  line([[-1.3, 1.93], [-1.5, 2.09], [-1.8, 2.11], [-2.13, 1.98]], '#fff', 0.06);   // neck trim
  line([[-1.35, 3.3], [-1.9, 3.35]], redDark, 0.03);                                // waist folds
  line([[-1.45, 3.45], [-2.1, 3.48]], redDark, 0.025);
  ctx.font = `0.6px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 0.16; ctx.strokeStyle = '#fff'; ctx.strokeText('23', -1.78, 2.9);
  ctx.fillStyle = '#111'; ctx.fillText('23', -1.78, 2.9);
}

// Fingers wrap from the palm around the back of the ball; angles are around the ball.
function ballHand() {
  limb([[-0.42, 0.5, 0.1], [-0.33, 0.35, 0.12], [-0.27, 0.27, 0.13]], SKIN_FAR, 0.035);
  for (let i = 0; i < 4; i++) {
    const a0 = 2.55 + i * 0.22, a1 = a0 + 0.55;
    limb([[Math.cos(a0) * 0.44, Math.sin(a0) * 0.44, 0.045],
          [Math.cos(a1) * 0.32, Math.sin(a1) * 0.32, 0.036]], SKIN_FAR, 0.025);
  }
  limb([[Math.cos(2.2) * 0.44, Math.sin(2.2) * 0.44, 0.05],
        [Math.cos(1.75) * 0.33, Math.sin(1.75) * 0.33, 0.04]], SKIN_FAR, 0.025);   // thumb
}
function openHand() {
  limb([[-0.52, 3.0, 0.1], [-0.36, 3.04, 0.12]], SKIN, 0.035);
  const tips = [[-0.03, 2.92], [0.01, 3.02], [-0.01, 3.12], [-0.08, 3.2]];
  tips.forEach((t, i) => limb([[-0.28, 2.98 + i * 0.05, 0.043], [t[0], t[1], 0.034]], SKIN, 0.025));
  limb([[-0.4, 2.95, 0.045], [-0.27, 2.83, 0.036]], SKIN, 0.025);                 // thumb
  limb([[-0.74, 2.92, 0.13], [-0.6, 2.96, 0.13]], WHITE, 0.035);                  // wristband
}

// One-hand dunk pose, facing right, legs trailing behind.
function drawPlayer(hx, hy, holding) {
  ctx.save(); ctx.translate(hx, hy); ctx.scale(u, u);
  limb([[-1.35, 1.95, 0.18], [-1.12, 1.6, 0.175], [-0.85, 1.2, 0.12], [-0.7, 0.95, 0.13], [-0.42, 0.5, 0.09]], SKIN_FAR);        // ball arm
  // trailing leg, kicked back
  limb([[-2.15, 4.0, 0.25], [-3.05, 4.55, 0.17], [-3.3, 4.38, 0.18], [-3.7, 4.05, 0.11]], SKIN_FAR);
  limb([[-3.7, 4.05, 0.13], [-3.45, 4.25, 0.14]], WHITE, 0.035);
  shoe(-3.7, 4.05, 2.9);
  // tucked leg with knee brace
  limb([[-1.7, 4.05, 0.26], [-1.45, 5.05, 0.18], [-1.65, 5.3, 0.2], [-2.15, 5.85, 0.11]], SKIN);
  limb([[-1.53, 4.88, 0.23], [-1.42, 5.17, 0.23]], BRACE, 0.035);
  limb([[-2.15, 5.85, 0.13], [-1.95, 5.62, 0.14]], WHITE, 0.035);
  shoe(-2.15, 5.85, 1.4);
  drawJersey();
  limb([[-1.78, 2.02, 0.16], [-1.6, 1.62, 0.15]], SKIN);                               // neck
  drawHead();
  limb([[-1.95, 2.15, 0.19], [-1.6, 2.42, 0.19], [-1.2, 2.72, 0.13], [-0.95, 2.84, 0.14], [-0.52, 3.0, 0.095]], SKIN);            // near arm
  openHand();
  ctx.restore();

  if (holding) {
    star(hx - R * 0.9, hy - R * 0.2, R * (1.4 + 0.5 * Math.sin(clock * 14)), 0.9);
    drawBall(hx, hy, 0);
  }
  ctx.save(); ctx.translate(hx, hy); ctx.scale(u, u);
  ballHand();
  ctx.restore();
}

function drawHUD() {
  const s = 8 * P;                                    // one "font pixel row" of 8 low-res px
  // basketball badge, top-left, with points
  ctx.fillStyle = OUT;
  ctx.beginPath(); ctx.arc(9 * s * 0.5, 0, 5.6 * s * 0.5 + P, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8641c';
  ctx.beginPath(); ctx.arc(9 * s * 0.5, 0, 5.6 * s * 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = OUT; ctx.fillRect(0.6 * s, 1.55 * s, 7.8 * s * 0.5, P);
  arcadeText(String(makes * 2), 4.5 * s, 0.4 * s, s, '#ffd23f', 'center');
  arcadeText('PTS', 4.5 * s, 1.75 * s, s * 0.75, '#fff', 'center');

  if (streak >= 3) {
    if (Math.floor(clock * 6) % 2) arcadeText('ON FIRE', W - 0.6 * s, 0.6 * s, s, '#ff8c1a', 'right');
  } else {
    arcadeText(`${makes}/${shots}`, W - 0.6 * s, 0.6 * s, s, '#ffd23f', 'right');
  }
  if (W / P > 300) {
    ctx.font = `${s}px ${FONT}`;
    const tw = ctx.measureText('FREE PLAY').width;
    ctx.fillStyle = '#0a2a6b'; ctx.fillRect(W / 2 - tw / 2 - P * 3, 0, tw + P * 6, s + P * 6);
    ctx.fillStyle = '#4cc9f0'; ctx.fillRect(W / 2 - tw / 2 - P * 3, s + P * 5, tw + P * 6, P);
    arcadeText('FREE PLAY', W / 2, P * 3, s, '#fff', 'center');
  }
  if (shots === 0) {
    const a = 0.6 + 0.4 * Math.sin(clock * 4);
    ctx.globalAlpha = a;
    arcadeText(matchMedia('(pointer: coarse)').matches ? 'DRAG TO FLY - LIFT TO DROP' : 'MOVE TO FLY - CLICK TO DROP', W / 2, floorY + (H - floorY) / 2 - s * 0.3, Math.round(s * 0.5), '#fff', 'center');
    ctx.globalAlpha = 1;
  }

  for (const p of popups) {
    const size = s * (p.text.length > 6 ? 1.3 : 1.6) * Math.min(1, 0.4 + p.t * 5);
    ctx.font = `${size}px ${FONT}`;
    const half = ctx.measureText(p.text).width / 2;
    const x = Math.min(Math.max(p.x, half + s * 0.5), W - half - s * 0.5);
    ctx.globalAlpha = Math.max(0, 1.3 - p.t);
    arcadeText(p.text, x, p.y - p.t * u, size, p.text === 'ON FIRE!' ? '#ff8c1a' : '#ffd23f', 'center');
    ctx.globalAlpha = 1;
  }
}

function emitFire(x, y) {
  for (let i = 0; i < 2; i++) {
    sparks.push({ x: x + (Math.random() - 0.5) * R, y: y + (Math.random() - 0.5) * R,
                  vx: (Math.random() - 0.5) * 2 * u, vy: -(2 + Math.random() * 3) * u, t: 0 });
  }
}
function drawSparks() {
  const cols = ['#fff3b0', '#ffd23f', '#ff8c1a', '#e63946', '#6a040f'];
  for (const s of sparks) {
    const k = Math.min(cols.length - 1, Math.floor(s.t / 0.1));
    ctx.fillStyle = cols[k];
    const size = P * (3 - k * 0.4);
    ctx.fillRect(s.x - size / 2, s.y - size / 2, size, size);
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  clock += dt;

  if (!hasBall) { cooldown -= dt; if (cooldown <= 0) hasBall = true; }
  for (const b of balls) {
    b.life += dt;
    for (let i = 0; i < 4; i++) step(b, dt / 4);
    if (b.fire && b.life < 3) emitFire(b.x, b.y);
  }
  if (hasBall && streak >= 3) emitFire(mx, my);
  balls = balls.filter(b => b.life < 8 && b.x < W + 4 * R);
  for (const s of sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; }
  sparks = sparks.filter(s => s.t < 0.5);
  popups.forEach(p => p.t += dt);
  popups = popups.filter(p => p.t < 1.3);
  netSway = Math.max(0, netSway - dt * 1.2);
  if (Math.random() < 0.3) flashes.push({ x: Math.random() * W, y: Math.random() * (floorY - 1.4 * u), t: 0 });
  flashes.forEach(f => f.t += dt);
  flashes = flashes.filter(f => f.t < 0.1);

  ctx.drawImage(bg, 0, 0, bg.width * P, bg.height * P);
  for (const f of flashes) star(f.x, f.y, 0.45 * u, 1 - f.t * 8);
  drawHoop();
  drawShadow(mx - 1.8 * u, floorY - my - 6 * u);
  for (const b of balls) drawShadow(b.x, floorY - b.y);
  for (const b of balls) drawBall(b.x, b.y, b.rot);
  drawRimAndNet();
  drawSparks();
  drawHUD();
  spriteCtx.clearRect(0, 0, W, H);
  ctx = spriteCtx; PX = PS;
  drawPlayer(mx, my, hasBall);
  ctx = mainCtx; PX = P;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
